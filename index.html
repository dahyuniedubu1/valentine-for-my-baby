<!DOCTYPE html>
<html>
<head>
<title>For Pauleen 💜</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    overflow:hidden;
    text-align:center;

    /* Magical gradient background */
    background: radial-gradient(circle at 30% 30%, #9d4edd, #5a189a 60%, #3c096c);
    
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    flex-direction:column;
}

/* Floating tulips background */
.tulip {
    position:absolute;
    cursor:pointer;
    z-index:0;
    transition: transform 0.5s ease;
}

/* Highlight clickable tulips */
.tulip.clickable {
    text-shadow: 0 0 10px #ffb3ff, 0 0 20px #d291ff;
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
}

/* Envelope & Cards */
.card, .envelope, #tulipCard {
    width: 90%;
    max-width: 500px;
    background:#8e44ad;
    padding: clamp(20px, 5vw, 50px);
    border-radius:20px;
    color:white;
    box-shadow:0 15px 35px rgba(0,0,0,0.3);
    position:relative;
    z-index:2;
    animation: floatCard 4s ease-in-out infinite;
}

.envelope {
    cursor:pointer;
    font-size: clamp(18px, 2.5vw, 24px);
}

@keyframes floatCard {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

button {
    padding:12px 24px;
    margin:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

#yesBtn {
    background:#c77dff;
    color:white;
    transition: transform 0.3s;
}

#noBtn { background:#ddd; }

/* Hearts */
.heart {
    position:absolute;
    color:#d291ff;
    animation: floatUp 5s linear forwards;
    z-index:3;
}

@keyframes floatUp {
    from { transform: translateY(0); opacity:1;}
    to { transform: translateY(-100vh); opacity:0;}
}

/* Confetti */
.confetti {
    position:absolute;
    width:8px;
    height:8px;
    background:#9d4edd;
    top:0;
    animation: fall 4s linear forwards;
    z-index:3;
}

@keyframes fall {
    to { transform: translateY(100vh) rotate(720deg); opacity:0; }
}

/* Photo */
#photoCheer {
    margin-top: 20px;
    width: 180px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    transform: scale(0);
    transition: transform 0.8s ease;
}

/* Tulip message card */
#tulipCard {
    max-width:700px;
    font-size: clamp(16px, 2vw, 22px);
}
</style>
</head>
<body>

<div id="main"></div>
<img id="photoCheer" src="" alt="Cheering Photo">

<script>
const tulipMessages = [
    "Pauleen, your laugh is my favorite sound in the world.",
    "Every time I see you, my heart feels full of joy.",
    "You make ordinary days feel extraordinary.",
    "Thinking of you brightens even the darkest moments.",
    "Your smile is a light I never want to lose.",
    "Being with you makes me feel truly alive.",
    "Every memory with you is my treasure.",
    "I fall for you more with every word, every glance.",
    "You are my happiness, my peace, and my dream.",
    "I want to hold your hand through all of life’s adventures."
];

let tulipIndex = 0;
let tulipClicks = 0;

/* Floating tulips with depth */
function createTulip(clickable=false){
    const t = document.createElement("div");
    t.className = "tulip";
    if(clickable) t.classList.add("clickable");

    t.innerHTML = "🌷";

    let size = Math.random() * 30 + 20;
    t.style.fontSize = size + "px";
    t.style.left = Math.random()*100 + "vw";
    t.style.top = Math.random()*100 + "vh";
    t.style.filter = `blur(${Math.random()*2}px)`;
    t.style.opacity = 0.4 + Math.random()*0.6;

    if(clickable){
        t.addEventListener("click", nextTulipMessage);
    }

    document.body.appendChild(t);
    setTimeout(() => t.remove(), 30000);
}
setInterval(()=>createTulip(),800);

/* Start page */
document.getElementById("main").innerHTML=`<div class="envelope" onclick="openCard()">Tap to open 💜</div>`;

/* Pages */
function openCard(){
    main.innerHTML=`<div class="card"><h2>Pauleen, can I be your Valentine?</h2><button onclick="pageTwo()">Next</button></div>`;
}

function pageTwo(){
    main.innerHTML=`<div class="card">
        <h2>Please Pauleen...</h2>
        <p>You mean a lot to me.<br>Will you be my Valentine?</p>
        <button id="yesBtn" onclick="yesCelebration()">Yes</button>
        <button id="noBtn" onclick="growYes()">No</button>
    </div>`;
}

let yesSize=1;
function growYes(){
    yesSize+=0.3;
    yesBtn.style.transform = "scale("+yesSize+")";
}

/* Celebration */
function createHeart(){
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="💜";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(10+Math.random()*30)+"px";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
}
function createConfetti(){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
}

function yesCelebration(){
    photoCheer.style.transform="scale(1)";
    let amount = window.innerWidth / 8;
    for(let i=0;i<amount;i++){
        setTimeout(()=>{ createHeart(); createConfetti(); }, i*25);
    }
    setTimeout(pageFour,2000);
}

/* Tulip message stage */
function pageFour(){
    tulipIndex=0;
    tulipClicks=0;
    main.innerHTML=`<div id="tulipCard">
        <h2>Interactive Tulips 🌷</h2>
        <p id="tulipMessage">${tulipMessages[0]}</p>
        <p>Click the glowing tulips to reveal all the messages!</p>
    </div>`;
    for(let i=0;i<10;i++) createTulip(true);
}

function nextTulipMessage(){
    tulipIndex++;
    tulipClicks++;
    if(tulipIndex>=tulipMessages.length) tulipIndex=tulipMessages.length-1;
    tulipMessage.innerText = tulipMessages[tulipIndex];

    if(tulipClicks >= 10){
        tulipMessage.innerText =
`Pauleen,

From the moment we truly started talking, something in my world quietly changed. Since then, your smile stays on my mind, your laughter plays in my heart, and every memory we share feels like something I want to keep forever.

You make ordinary days feel special. Even in silence, just knowing you’re there brings me comfort and peace.

I want to walk beside you through every part of life — the happy moments, the hard ones, and everything in between.`;
    }
}
</script>

</body>

</html>
